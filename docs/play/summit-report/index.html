<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<script>window.ONESTORE = true;</script>
<script type="module">
// 원스토어 H5 Game SDK — 게임 코드보다 먼저 받고, 리스너를 붙인 뒤 초기화한다(platform.js PF.attach).
import { createSDK } from "https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js";
PF.attach(createSDK());
</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정상 보고</title>
<style>
:root {
  --bg: #0e1511; --panel: #151f18; --line: #263429; --text: #e3e8e1; --dim: #8b9b8f;
  --accent: #e0a84a; --red: #e2574c; --amber: #e0a84a; --green: #6cc08b; --blue: #6aa8e8;
  --phone: #0a0c0f; --phone2: #151a21; --bub: #222a34; --me: #2f5f8f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
small { color: var(--dim); }
.dim { color: var(--dim); }

#top { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#clock { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
#top .sp { flex: 1; }
#top button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; }
#top button.on { border-color: var(--accent); color: var(--accent); }
#mode-tag { color: var(--blue); font-size: 12px; }

#main { display: flex; gap: 18px; padding: 16px; max-width: 1120px; margin: 0 auto; align-items: flex-start; }
#trail { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
#t-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
#t-place { font-size: 19px; font-weight: 700; }
#t-badge { text-align: right; font-size: 12px; color: var(--dim); white-space: nowrap; }
#t-badge b { display: block; font-size: 20px; color: var(--text); }
#ch-tag { color: var(--accent); font-weight: 600; }
#t-rule { margin: -4px 0 8px; } #t-rule small { font-size: 11px; }
.bars { margin: 12px 0; display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 34px 1fr 44px; gap: 8px; align-items: center; font-size: 12px; color: var(--dim); }
.bar b { color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
.track { height: 8px; background: #0c120e; border-radius: 4px; overflow: hidden; }
.track div { height: 100%; background: var(--green); transition: width .3s; }
.bar .track div.low { background: var(--red); }
.bar.b1 .track div { background: var(--accent); }
.bar.b1 .track div.low { background: var(--red); }
#t-compass { display: flex; align-items: center; gap: 10px; margin: 8px 0 12px; }
#t-compass button { background: #0c120e; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
#v-face { flex: 1; text-align: center; }
.view { background: #0c120e; border: 1px solid #3a4a2f; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
.view ul { margin: 6px 0 0; padding-left: 18px; }
.event { background: #2a2414; border: 1px solid var(--accent); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
.event p { margin: 6px 0 10px; }
.event button, #t-actions button { display: block; width: 100%; text-align: left; background: #0c120e; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; }
.event button:hover:not(:disabled), #t-actions button:hover:not(:disabled) { border-color: var(--accent); }
#t-actions button small, .event button small { display: block; font-size: 12px; }
.final-h { margin: 12px 0 6px; color: var(--accent); font-weight: 700; }
#t-log { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; max-height: 360px; overflow-y: auto; }
.line { padding: 3px 0; }
.line .tm { color: var(--dim); font-variant-numeric: tabular-nums; margin-right: 8px; font-size: 12px; }
.line.place { color: #cfe3cf; font-weight: 600; }
.line.boom { color: #f0b080; }
.line.flash { color: #fff3b0; font-weight: 700; }
.line.warn { color: var(--red); }
.line.clue { color: var(--blue); }
.line.dim { color: var(--dim); }

#phone { width: 360px; flex: none; height: 720px; background: var(--phone); border: 10px solid #23272d; border-radius: 38px; position: relative; overflow: hidden; display: flex; flex-direction: column; }
#ph-status { display: flex; align-items: center; gap: 8px; padding: 10px 18px 2px; font-size: 12px; min-height: 30px; }
#ph-status b { flex: 1; text-align: center; }
.sig { display: inline-flex; align-items: flex-end; gap: 2px; height: 15px; }
.sig i { width: 4px; background: #3a4048; border-radius: 1px; }
.sig i.on { background: var(--text); }
.bat.low { color: var(--red); }
#ph-rule { padding: 0 14px 6px; font-size: 11px; min-height: 22px; border-bottom: 1px solid #1d232b; }
#ph-rule .s0 { color: var(--red); } #ph-rule .s1 { color: var(--amber); } #ph-rule .s2 { color: #d8d27a; } #ph-rule .s3, #ph-rule .s4 { color: var(--green); }
#ph-banner { position: absolute; top: 34px; left: 8px; right: 8px; z-index: 5; pointer-events: none; }
.banner { background: rgba(40, 46, 56, .97); border-radius: 14px; padding: 8px 12px; box-shadow: 0 6px 20px #0008; animation: drop .25s; }
.banner b { display: block; font-size: 12px; }
.banner span { font-size: 13px; }
@keyframes drop { from { transform: translateY(-20px); opacity: 0; } }
#ph-body { flex: 1; overflow-y: auto; }
#ph-home { height: 26px; flex: none; display: flex; justify-content: center; align-items: center; cursor: pointer; }
#ph-home::after { content: ""; width: 110px; height: 5px; border-radius: 3px; background: #555; }
.dead { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #555; gap: 8px; text-align: center; }

.home { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 8px; padding: 22px 16px 10px; }
.app { position: relative; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; }
.ic { width: 52px; height: 52px; border-radius: 14px; display: block; }
.ic-msg { background: linear-gradient(135deg, #f2d14c, #d9a72a); } .ic-map { background: linear-gradient(135deg, #5cb98a, #2f7a5a); }
.ic-news { background: linear-gradient(135deg, #e86a5a, #b33b30); } .ic-cmd { background: linear-gradient(135deg, #6aa8e8, #2f5f9f); }
.ic-cam { background: linear-gradient(135deg, #888, #444); } .ic-gps { background: linear-gradient(135deg, #b88ae8, #6a3fa8); }
.app em, .chrow em { position: absolute; top: -4px; right: 14px; background: var(--red); color: #fff; font-style: normal; font-size: 11px; border-radius: 10px; padding: 0 6px; min-width: 18px; text-align: center; }
.notis { padding: 4px 12px 12px; }
.cap { font-size: 11px; color: var(--dim); margin: 10px 0 4px; }
.noti { background: var(--phone2); border-radius: 10px; padding: 6px 10px; margin-bottom: 4px; font-size: 12px; }
.hdr { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #1d232b; position: sticky; top: 0; background: var(--phone); z-index: 2; }
.hdr button { background: none; border: 0; font-size: 22px; line-height: 1; padding: 0 6px; }
.hdr b { flex: 1; }
.hdr small { font-size: 11px; }
.chrow { position: relative; display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid #1a1f26; padding: 10px 14px; }
.chrow b { display: block; }
.chrow span { font-size: 12px; color: var(--dim); }
.chrow em { top: 14px; right: 14px; }
.chrow.op b { color: var(--red); }
.bubs { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.bub { background: var(--bub); border-radius: 12px; padding: 7px 10px; max-width: 86%; }
.bub p { margin: 0; }
.bub.me { background: var(--me); align-self: flex-end; }
.bub.urg { border-left: 3px solid var(--red); }
.bub small { font-size: 10px; }
.bub .link { background: none; border: 0; color: var(--blue); padding: 2px 0; font-size: 12px; display: block; }
.decs button { display: block; width: 100%; margin-top: 6px; background: #0e1218; border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 6px; }
.sys { text-align: center; font-size: 11px; color: var(--dim); }
.map { width: 100%; display: block; }
.map .n { fill: var(--dim); font-size: 11px; }
.map .face { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; }
.map .mtn { fill: #6cc08b; }
.map .lbl { fill: var(--text); font-size: 11px; text-anchor: middle; }
.map .v { fill: #000; font-size: 11px; font-weight: 700; text-anchor: middle; }
.map .age { fill: var(--dim); font-size: 9px; text-anchor: middle; }
.map .dist { cursor: pointer; }
.map .d-none { fill: #2a3038; stroke: #555; stroke-dasharray: 3 2; }
.map .d-low { fill: var(--green); } .map .d-mid { fill: var(--amber); } .map .d-high { fill: var(--red); }
.map .dist .v { fill: #000; }
.pad { padding: 10px 14px; }
.poll { margin: 10px; background: var(--phone2); border-radius: 10px; padding: 8px 12px; }
.poll b { font-size: 18px; }
.poll small { display: block; }
.news { margin: 0 10px 8px; border-bottom: 1px solid #1a1f26; padding-bottom: 6px; }
.news em { font-style: normal; font-size: 11px; color: var(--amber); }
.news.press em { color: var(--blue); }
.news p { margin: 2px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--phone2); border: 1px solid #2a323c; border-radius: 16px; padding: 4px 10px; font-size: 12px; }
.chip small { margin-left: 4px; }
.chip.on { border-color: var(--blue); background: #1d3550; }
.pad > button, .pad button.big2 { display: block; width: 100%; margin-top: 10px; background: #1d3550; border: 1px solid var(--blue); border-radius: 10px; padding: 8px; }
.pad > button small { display: block; font-size: 11px; }
.sent { font-size: 12px; padding: 3px 0; border-bottom: 1px solid #1a1f26; }
.big-num { font-size: 40px; font-weight: 700; }
.big-num small { font-size: 13px; margin-left: 6px; }
.ok { color: var(--green); } .bad { color: var(--red); }
#ph-call:empty { display: none; }
.call { position: absolute; inset: 0; z-index: 6; background: linear-gradient(#1b2633, #0a0c0f); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 20px; }
.call .who { font-size: 20px; font-weight: 700; text-align: center; }
.call .who small { display: block; font-size: 11px; font-weight: 400; }
.call .row { display: flex; gap: 40px; margin-top: 40px; }
.call .row button { width: 70px; height: 70px; border-radius: 50%; border: 0; background: var(--red); }
.call .row button:last-child { background: var(--green); color: #000; }
.call.talk { justify-content: flex-start; padding-top: 40px; }
.call .lines { overflow-y: auto; flex: 1; width: 100%; }
.call .lines p { background: #ffffff10; border-radius: 10px; padding: 8px 10px; margin: 0 0 8px; }
.call .col { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.call .col button { background: #ffffff14; border: 1px solid #ffffff30; border-radius: 10px; padding: 8px; }

#truth { display: none; position: fixed; left: 12px; bottom: 12px; background: #000d; border: 1px solid #444; border-radius: 8px; padding: 8px 10px; font-size: 11px; z-index: 20; }
#truth td, #truth th { padding: 0 6px; text-align: right; }
#overlay { display: none; position: fixed; inset: 0; background: #070b08ee; z-index: 30; overflow-y: auto; padding: 24px 16px; }
#overlay.show { display: block; }
.card { max-width: 680px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
.card h1 { margin: 0 0 4px; font-size: 30px; }
.card .sub { margin: 0 0 14px; color: var(--accent); }
.card label { display: block; margin: 10px 0; }
.card select { background: #0c120e; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px; }
.how { padding-left: 18px; color: #c9d3c9; }
.card .big { display: block; width: 100%; margin: 16px 0 6px; padding: 12px; font-size: 17px; font-weight: 700; background: var(--accent); color: #1a1408; border: 0; border-radius: 10px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; }
.stats div { background: #0c120e; border-radius: 8px; padding: 8px; font-size: 11px; color: var(--dim); }
.stats b { display: block; font-size: 20px; color: var(--text); }
.re li { margin-bottom: 6px; }
details { margin: 8px 0; }
pre { white-space: pre-wrap; font-size: 12px; background: #0c120e; padding: 10px; border-radius: 8px; max-height: 260px; overflow-y: auto; }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
.card .row button { background: #0c120e; border: 1px solid var(--accent); border-radius: 8px; padding: 8px 14px; }
.tblwrap { overflow-x: auto; }
.runs { border-collapse: collapse; font-size: 12px; width: 100%; }
.runs td, .runs th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; white-space: nowrap; }
#err { display: none; position: fixed; right: 8px; bottom: 8px; background: #400; color: #fff; padding: 8px; font: 12px monospace; white-space: pre; z-index: 99; }

/* 장 사이 연결 표시 (GDD 4.3) */
.ltag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 8px; font-size: 11px; font-weight: 600; color: #1a1408; background: var(--accent); vertical-align: 1px; white-space: nowrap; }
.event .ltag { margin-left: 8px; }
.event.resolve { border-color: var(--blue); background: #14202c; }
/* 1장 오미숙: 낡은 휴대폰, 큰 글씨 */
#phone.old { border-color: #6b5a44; background: #f3ecdd; color: #2b2418; font-size: 16px; }
#phone.old .dim, #phone.old small, #phone.old .cap { color: #6e6352; }
#phone.old .sig i { background: #c9bda6; } #phone.old .sig i.on { background: #2b2418; }
#phone.old #ph-rule { border-color: #d8ccb4; }
#phone.old #ph-rule .s3, #phone.old #ph-rule .s4 { color: #2f7a4a; }
#phone.old .hdr { background: #f3ecdd; border-color: #d8ccb4; }
#phone.old .bub { background: #fffaf0; border: 1px solid #e0d5bf; }
#phone.old .bub.me { background: #ffe58a; border-color: #e8cf6a; }
#phone.old .noti, #phone.old .poll { background: #fffaf0; border: 1px solid #e0d5bf; }
#phone.old .chrow { border-color: #e0d5bf; }
#phone.old .news { border-color: #e0d5bf; }
#phone.old .banner { background: rgba(255, 250, 238, .98); color: #2b2418; border: 1px solid #d8ccb4; }
#phone.old .dead { color: #8b7f6b; }
#phone.old .decs button { background: #fffaf0; color: #8a5a00; border-color: #c08a1a; }
#phone.old #ph-home::after { background: #b9ab90; }
#phone.old .sent { border-color: #e0d5bf; }
#phone.old .call { background: linear-gradient(#e9dfc8, #f3ecdd); color: #2b2418; }
#phone.old .call .lines p { background: #fffaf0; }
#phone.old .call .col button { background: #fffaf0; border-color: #c9bda6; }
.ic-calls, .ic-call { background: linear-gradient(135deg, #6cc08b, #2f7a5a); }
.ic-live { background: linear-gradient(135deg, #ff5a7a, #c2264a); } .ic-notes { background: linear-gradient(135deg, #e8c46a, #a87a1f); }
.hearing { text-align: center; padding: 10px; color: var(--dim); animation: hearing 1.4s ease-in-out infinite; }
.hearing small { display: block; font-size: 11px; }
@keyframes hearing { 50% { opacity: .45; } }
.call.talk .lines[data-act], .call.talk .col[data-act] { cursor: pointer; }
.ptabs { display: flex; gap: 6px; padding: 6px 10px 0; }
.ptabs button { flex: 1; position: relative; padding: 6px 4px; border-radius: 10px 10px 0 0; border: 1px solid #2a323c; border-bottom: 0; background: var(--phone2); color: var(--dim); font-size: 13px; }
.ptabs button.on { background: var(--phone); color: inherit; font-weight: 700; border-color: var(--blue); }
.ptabs button.op.on { border-color: #b3444c; }
.p2row.on { border-color: var(--accent) !important; }
.p2row b { font-weight: 600; }
.p2row small { opacity: .8; }
#t-actions .cap { margin-top: 14px; }
.ptabs.five { gap: 3px; padding: 6px 6px 0; }
.ptabs.five button { padding: 6px 0; font-size: 13px; }
.ptabs button.dead { text-decoration: line-through; opacity: .6; }
#phone.p2 .bub.urg { border-left: 3px solid var(--red); }
.ptabs em { margin-left: 6px; background: var(--red); color: #fff; font-style: normal; font-size: 11px; border-radius: 10px; padding: 0 6px; }
.livebox { margin: 10px; padding: 10px 12px; border-radius: 10px; background: var(--phone2); }
.livebox.on { border: 1px solid #ff5a7a; }
.livebox b.rec { color: #ff5a7a; }
.chat { padding: 0 12px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
.chat div b { color: var(--dim); font-weight: 500; margin-right: 6px; }
.chat div.hot { color: #ffb86b; }
.note { margin: 6px 10px; padding: 6px 10px; border-radius: 8px; background: var(--phone2); font-size: 13px; }
.note em { display: block; font-style: normal; font-size: 11px; color: var(--dim); }
#phone.op { border-color: #3a1418; }
#phone.op #ph-status, #phone.op .hdr { background: #160a0c; }
#phone.op .bub.me { background: #6b2a2f; }
/* 타이틀 · 장 화면 */
.card h2 { margin: 0 0 12px; font-size: 18px; color: var(--accent); font-weight: 600; }
.card.intro h1 { font-size: 34px; }
.inh { background: #2a2414; border: 1px solid var(--accent); border-radius: 8px; padding: 8px 12px; margin: 10px 0; }
.chs { list-style: none; padding: 0; margin: 12px 0; }
.chs li { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
.chs li.done { color: var(--green); } .chs li.next { border-color: var(--accent); } .chs li.lock { color: var(--dim); }
.card > button:not(.big) { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; color: var(--dim); }
.facts { padding-left: 18px; } .facts li { margin-bottom: 8px; }
/* 3부: 증거함 태블릿과 보고서 */
#phone.tab { border-radius: 24px; border-color: #3a3f47; }
.ev { margin: 6px 10px; padding: 8px 10px; border-radius: 8px; background: var(--phone2); font-size: 13px; }
.ev p { margin: 4px 0 0; }
.ev em { font-style: normal; font-size: 11px; color: var(--amber); margin-left: 4px; }
.ev i { float: right; font-style: normal; font-size: 11px; color: var(--blue); }
.ev.blank { background: none; border: 1px dashed #3a4048; color: var(--dim); }
.ev.blank em { color: var(--dim); }
.ev.todo { background: none; border: 1px dotted #2a323c; color: var(--dim); font-size: 12px; }
.rq { margin: 8px 10px; padding: 8px 10px; border-radius: 8px; background: var(--phone2); border-left: 3px solid #555; font-size: 13px; }
.rq.lv1 { border-left-color: var(--amber); } .rq.lv2 { border-left-color: var(--green); }
.rq p { margin: 6px 0; }
.rq .lv { float: right; font-size: 11px; color: var(--dim); }
.rq.lv1 .lv { color: var(--amber); } .rq.lv2 .lv { color: var(--green); }
.rq > small { display: block; margin-bottom: 6px; }
.rq .chip.add { border-style: dashed; color: var(--blue); }
.pickbox { margin-top: 6px; padding-top: 6px; border-top: 1px solid #2a323c; display: flex; flex-wrap: wrap; gap: 6px; }
.ending { text-align: center; margin: 14px 0; padding: 14px; border: 1px solid var(--accent); border-radius: 10px; background: #2a2414; }
.ending h1 { font-size: 32px; }
.rep { border-collapse: collapse; width: 100%; font-size: 13px; }
.rep td, .rep th { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; }
.rep td:first-child { width: 24%; }
.check { background: #14202c; border: 1px solid var(--blue); border-radius: 10px; padding: 4px 14px 10px; margin-top: 14px; }

#mtabs { display: none; }
body { padding-top: var(--sa-top, 0px); }   /* 원스토어 앱이 알려 주는 시스템바 자리(platform.js) */

/* 막간 연출(cinema.js): 그림은 천천히 밀려 들어오고, 위아래 띠가 내려오고, 잎이나 눈이 떨어진다 */
#overlay.cinema { background: #050706; padding-top: 0; }
.cine { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
.cine img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: kb 38s ease-out both; filter: saturate(1.05); }
.cine.k-hanul img, .cine.k-doyun img, .cine.k-part3 img { animation-name: kb2; }
@keyframes kb { from { transform: scale(1.0) translate(0, 0); } to { transform: scale(1.14) translate(-1.5%, -1%); } }
@keyframes kb2 { from { transform: scale(1.14) translate(1.5%, 0); } to { transform: scale(1.02) translate(0, -1%); } }
.cine .fog { position: absolute; inset: -20% -40%; background: radial-gradient(ellipse at 30% 60%, #ffffff22, transparent 55%), radial-gradient(ellipse at 75% 40%, #ffffff18, transparent 50%); animation: fog 26s ease-in-out infinite alternate; }
@keyframes fog { from { transform: translateX(-6%); } to { transform: translateX(6%); } }
.cine::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, #05070600 35%, #050706cc 100%); }
.cine .bars::before, .cine .bars::after { content: ''; position: absolute; left: 0; right: 0; height: 7vh; background: #000; z-index: 2; animation: bars 1.6s ease-out both; }
.cine .bars::before { top: 0; } .cine .bars::after { bottom: 0; }
@keyframes bars { from { height: 0; } }
.fx i { position: absolute; top: -6%; width: calc(14px * var(--s)); height: calc(10px * var(--s)); border-radius: 60% 0 60% 0; background: #c2412a; opacity: .85; animation: fall linear infinite; }
.fx.snow i { width: calc(7px * var(--s)); height: calc(7px * var(--s)); border-radius: 50%; background: #f4f7fa; opacity: .8; }
@keyframes fall { 0% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(4vw, 55vh) rotate(200deg); } 100% { transform: translate(-2vw, 112vh) rotate(400deg); } }
#overlay.cinema .card { position: relative; z-index: 3; margin-top: 46vh; background: #0d130fd9; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: cardin .9s ease-out both; }
#overlay.cinema.title .card { margin-top: 34vh; }
#overlay.cinema .card.end { margin-top: 30vh; animation: none; }
@keyframes cardin { from { opacity: 0; transform: translateY(24px); } }
.reveal { position: fixed; left: 0; right: 0; bottom: 13vh; padding: 40px 0 10px; background: radial-gradient(ellipse at 50% 70%, #000a, transparent 70%); z-index: 3; text-align: center; color: #fff; text-shadow: 0 2px 18px #000c; pointer-events: none; opacity: 0; transition: opacity .8s; }
.reveal small { display: block; letter-spacing: .2em; color: #f0c56a; font-size: 14px; font-weight: 600; }
.reveal b { display: block; font-size: 46px; margin: 6px 0 2px; letter-spacing: .08em; }
.reveal span { font-size: 18px; color: #e8e2d4; }
#overlay.reveal-run .reveal { opacity: 1; }
#overlay.reveal-run .card { opacity: 0; transform: translateY(24px); pointer-events: none; animation: none; }
#overlay.cinema .card { transition: opacity .9s, transform .9s; }
@media (prefers-reduced-motion: reduce) { .cine img, .cine .fog, .fx i { animation: none; } .fx { display: none; } }

@media (max-width: 820px) {
  #main { flex-direction: column; padding: 12px 16px; }
  #phone { width: 100%; max-width: 380px; margin: 0 auto; height: 680px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  #mtabs { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: #0b100d; border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom) + var(--sa-bottom, 0px)); gap: 8px; }
  #mtabs button { flex: 1; padding: 11px 0; font-size: 15px; font-weight: 700; background: #121a15; border: 1px solid var(--line); border-radius: 10px; color: var(--dim); }
  #mtabs button.on { color: var(--text); border-color: var(--accent); background: #1d2419; }
  #mtabs button.alert { animation: tabalert 1s ease-in-out infinite; color: #fff; }
  #mtabs em { font-style: normal; background: var(--red); color: #fff; border-radius: 10px; padding: 0 7px; font-size: 12px; margin-left: 4px; }
  @keyframes tabalert { 50% { background: #5a2a1a; border-color: var(--red); } }
  body { padding-bottom: calc(70px + var(--sa-bottom, 0px)); }
  #main.v-phone #trail, #main.v-trail #phone { display: none; }
  #main.v-phone #phone { max-width: 460px; height: calc(100dvh - 150px); min-height: 480px; }
  #top { flex-wrap: wrap; gap: 6px; padding: 8px 12px; }
  #top button { padding: 4px 8px; }
  #overlay.cinema .card, #overlay.cinema.title .card { margin-top: 34vh; padding: 18px; }
  #overlay.cinema .card.end { margin-top: 24vh; }
  .reveal { bottom: 10vh; } .reveal b { font-size: 36px; }
}
